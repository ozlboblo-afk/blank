      name="twitter:image"
      content="https://blank-eight-mu.vercel.app/assets/img/ogp.png"
    />

    <!-- Theme -->
    <meta name="theme-color" content="#2F241D" />

    <!-- ==== Icons ==== -->
    <link rel="icon" href="/assets/icon/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/assets/icon/favicon.png" />

    <!-- ==== CSS ==== -->
    <link rel="stylesheet" href="style/common.css" />
    <link rel="stylesheet" href="style/contact.css" />

  <body>
    <!-- モバイルヘッダー -->
    <header class="mobileHeader">
      <button
        class="drawerButton"
        aria-label="メニュー"
        aria-expanded="false"
        aria-controls="sidebar"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

      <a href="/" class="mobileLogo">BLANK</a>
    </header>

    <!-- 背景 -->
    <div class="drawerOverlay"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <header class="sidebarHeader">
        <h1 class="siteLogo">
          <a href="/">
            <img
              src="assets/icon/logo.svg"
              class="logo"
              alt="BLANK Portfolio"
            />
          </a>
        </h1>

        <div class="headerLead">
          <p>
            Design with intention,
            <br />
            Code with precision.
          </p>

          <span>2026</span>
        </div>

        <nav class="globalNav">
          <ul>
            <li><a href="/">TOP</a></li>
            <li><a href="/coming-soon.html">ABOUT</a></li>
            <li><a href="/coming-soon.html">SKILL</a></li>
            <li><a href="/contact.html">CONTACT</a></li>
          </ul>
        </nav>
      </header>

      <footer class="sidebarFooter">
        <nav class="footerNav">
          <ul>
            <li><a href="/privacypolicy.html">プライバシーポリシー</a></li>

            <li>
              <a href="/legal.html">特定商取引法に基づく表記</a>
            </li>
          </ul>
        </nav>

        <small class="footerCopy">
          &copy; 2026 BLANK. All rights reserved.
        </small>
      </footer>
    </aside>

    <main class="main contactPage">
      <div class="pageInner">
        <div class="sectionHeader">
          <p class="sectionEyebrow">Contact</p>
          <h1>お問い合わせ</h1>
        </div>

        <div class="contactBody">
          <p class="contactLead">
            Webサイト制作・デザインに関するご相談やお問い合わせはこちらからご連絡ください。
          </p>

          <form
            class="contactForm"
            id="contact-form"
            action="https://formspree.io/f/xjgzblqr"
            method="post"
          >
            <div class="formGroup">
              <label class="formLabel" for="name">
                お名前
                <span class="formRequired">必須</span>
              </label>

              <input
                class="formInput"
                type="text"
                id="name"
                name="name"
                autocomplete="name"
                required
              />
            </div>

            <div class="formGroup">
              <label class="formLabel" for="email">
                メールアドレス
                <span class="formRequired">必須</span>
              </label>

              <input
                class="formInput"
                type="email"
                id="email"
                name="email"
                autocomplete="email"
                required
              />
            </div>

            <div class="formGroup">
              <label class="formLabel" for="subject">件名</label>

              <input
                class="formInput"
                type="text"
                id="subject"
                name="subject"
              />
            </div>

            <div class="formGroup">
              <label class="formLabel" for="message">
                お問い合わせ内容
                <span class="formRequired">必須</span>
              </label>

              <textarea
                class="formTextarea"
                id="message"
                name="message"
                rows="8"
                required
              ></textarea>
            </div>

            <div class="formAction">
              <button class="formSubmit" type="submit">送信する</button>
            </div>
          </form>
        </div>
      </div>
    </main>

    <script src="/js/common.js"></script>
    <script src="/js/contact.js"></script>
  </body>
</html>
