<html lang="ja">
  <head>
    <!-- ==== Basic ==== -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ==== SEO ==== -->

      name="description"
      content="Web制作のご相談・ご依頼など、お気軽にお問い合わせください。BLANKへのお問い合わせページです。"
    />

    <meta name="author" content="BLANK" />
    <meta name="robots" content="index, follow" />

    <!-- Google Search Console -->
    <meta
      name="google-site-verification"
      content="_Mgq7xGnBE078RTW8kS2AKwBDZSaswxzciclXmD8_Ko"
    />

    <!-- ==== Canonical ==== -->
    <link
      rel="canonical"
      href="https://blank-eight-mu.vercel.app/contact.html"
    />

    <!-- ==== OGP ==== -->
    <meta property="og:title" content="CONTACT | BLANK" />
    <meta
      property="og:description"
      content="Web制作のご相談・ご依頼など、お気軽にお問い合わせください。BLANKへのお問い合わせページです。"
    />
    <!-- ogpの画像はつくりかえる -->
    <meta
      property="og:image"
      content="https://blank-eight-mu.vercel.app/assets/img/ogp.png"
    />
    <meta
      property="og:url"
      content="https://blank-eight-mu.vercel.app/contact.html"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BLANK" />
    <meta property="og:locale" content="ja_JP" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://blank-eight-mu.vercel.app/assets/img/ogp.png"
    />

    <!-- Theme -->
    <meta name="theme-color" content="#2F241D" />

    <!-- ==== Icons ==== -->
    <link rel="icon" href="/assets/icon/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/assets/icon/favicon.png" />

    <!-- ==== CSS ==== -->
    <link rel="stylesheet" href="style/style.css" />
  </head>

  <body>
    <!-- モバイルヘッダー -->
    <header class="mobileHeader">
      <button
        class="drawerButton"
        aria-label="メニュー"
        aria-expanded="false"
        aria-controls="sidebar"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

      <a href="/" class="mobileLogo">BLANK</a>
    </header>

    <!-- 背景 -->
    <div class="drawerOverlay"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <header class="sidebarHeader">
        <h1 class="siteLogo">
          <a href="/">
            <img
              src="assets/icon/logo.svg"
              class="logo"
              alt="BLANK Portfolio"
            />
          </a>
        </h1>

        <div class="headerLead">
          <p>
            Design with intention,
            <br />
            Code with precision.
          </p>

          <span>2026</span>
        </div>

        <nav class="globalNav">
          <ul>
            <li><a href="/">TOP</a></li>
            <li><a href="/coming-soon.html">ABOUT</a></li>
            <li><a href="/coming-soon.html">SKILL</a></li>
            <li><a href="/contact.html">CONTACT</a></li>
          </ul>
        </nav>
      </header>

      <footer class="sidebarFooter">
        <nav class="footerNav">
          <ul>
            <li><a href="/privacy-policy.html">プライバシーポリシー</a></li>

            <li>
              <a href="/legal.html">特定商取引法に基づく表記</a>
            </li>
          </ul>
        </nav>

        <small class="footerCopy">
          &copy; 2026 BLANK. All rights reserved.
        </small>
      </footer>
    </aside>

    <main class="main contactPage">
      <div class="container-md">
        <div class="sectionHeader">
          <p class="sectionEyebrow">Contact</p>
          <h1>お問い合わせ</h1>

          <p class="contactLead">
            Web制作のご相談・ご依頼など、 お気軽にお問い合わせください。
          </p>
        </div>

        <form class="contactForm">
          <div class="formItem">
            <label for="name">
              お名前
              <span>必須</span>
            </label>
            <input id="name" type="text" />
          </div>

          <div class="formItem">
            <label for="mail">
              メールアドレス
              <span>必須</span>
            </label>
            <input id="mail" type="email" />
          </div>

          <div class="formItem">
            <label for="subject">件名</label>
            <input id="subject" type="text" />
          </div>

          <div class="formItem">
            <label for="message">
              お問い合わせ内容
              <span>必須</span>
            </label>

            <textarea id="message" rows="8"></textarea>
          </div>

          <button class="contactSubmit" type="submit">
            <span class="contactLabel">Send Message</span>
            <span class="contactArrow"></span>
          </button>
        </form>

        <a href="/" class="backLink">
          <span></span>
          Back
        </a>
      </div>
    </main>

    <script src="/js/sidebar.js"></script>
  </body>
</html>
